spring.application.name=Estoque
spring.docker.compose.enabled=false
spring.datasource.url=${STOCK_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${STOCK_DB_USER:stock_api}
spring.datasource.password=${STOCK_DB_PASSWORD:}
spring.sql.init.mode=never

# Select remote for projects whose JWKS is empty (legacy HS256 signing).
# The default JWKS mode remains for projects with asymmetric signing keys.
stock.jwt.mode=${STOCK_JWT_MODE:jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_AUTH_ISSUER:http://localhost:54321/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:http://localhost:54321/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
stock.api.allowed-origins=${STOCK_API_ALLOWED_ORIGINS:http://localhost:5173}
stock.supabase.url=${SUPABASE_URL:}
stock.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
stock.auth.redirect-url=${STOCK_AUTH_REDIRECT_URL:http://localhost:5173/auth}
